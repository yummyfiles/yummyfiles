</style>
<rect width="1200" height="230" fill="transparent"/>
<rect x="100" y="15" width="1000" height="200" rx="2" fill="none" class="b" stroke-width="1" opacity=".28"/>
<g class="t" font-family="Share Tech Mono,monospace" font-size="17">
<text x="180" y="62">status</text><text x="350" y="62">coding</text>
