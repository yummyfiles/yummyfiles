    <g opacity="0">
      <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
      <text x="55" y="58" font-size="14" opacity="0.65">04 // FEATURED REPOSITORY</text>
      <text x="55" y="105" font-size="34">StylerX</text>
