      <text x="55" y="205" font-size="13">github.com/yummyfiles/MusicX</text>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.20;0.25;0.45;0.50;0.95;1" dur="16s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
      <text x="55" y="58" font-size="14" opacity="0.65">02 // FEATURED REPOSITORY</text>
      <text x="55" y="105" font-size="34">Klipix</text>
      <text x="55" y="140" font-size="16" opacity="0.8">A small clip / media side project</text>
      <text x="55" y="170" font-size="14" opacity="0.55">web  //  tools  //  side quest</text>
      <text x="55" y="205" font-size="13">github.com/yummyfiles/Klipix</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.25;0.45;0.50;1" dur="16s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
      <text x="55" y="58" font-size="14" opacity="0.65">03 // FEATURED REPOSITORY</text>
      <text x="55" y="105" font-size="34">Static</text>
