<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <rect width="900" height="250" fill="#000000"/>
  <defs>
    <clipPath id="carouselClip">
      <rect x="0" y="0" width="900" height="250"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="25" y="20" width="850" height="210" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#carouselClip)" font-family="'Share Tech Mono',monospace" fill="#FFFFFF">
    <g>
      <!-- MusicX -->
      <g transform="translate(0 0)">
        <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
        <g clip-path="url(#cardClip)">
          <rect x="25" y="20" width="850" height="210" fill="#FFFFFF" opacity="0.035"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="90 760" opacity="0.8">
            <animate attributeName="stroke-dashoffset" from="0" to="-850" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <rect x="55" y="45" width="7" height="7" fill="#FFFFFF">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <text x="75" y="52" font-size="14" opacity="0.65">01 // FEATURED REPOSITORY</text>
          <text x="55" y="118" font-size="34">MusicX</text>
          <text x="55" y="153" font-size="16" opacity="0.8">Free open-source offline music player</text>
          <text x="55" y="183" font-size="14" opacity="0.55">Kotlin  //  Jetpack Compose  //  Media3</text>
          <text x="55" y="213" font-size="13">github.com/yummyfiles/MusicX</text>
        </g>
      </g>

      <!-- Klipix -->
      <g transform="translate(900 0)">
        <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
        <g clip-path="url(#cardClip)">
          <rect x="25" y="20" width="850" height="210" fill="#FFFFFF" opacity="0.035"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="90 760" opacity="0.8">
            <animate attributeName="stroke-dashoffset" from="0" to="-850" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <rect x="55" y="45" width="7" height="7" fill="#FFFFFF">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <text x="75" y="52" font-size="14" opacity="0.65">02 // FEATURED REPOSITORY</text>
          <text x="55" y="118" font-size="34">Klipix</text>
          <text x="55" y="153" font-size="16" opacity="0.8">A small clip / media side project</text>
          <text x="55" y="183" font-size="14" opacity="0.55">web  //  tools  //  side quest</text>
          <text x="55" y="213" font-size="13">github.com/yummyfiles/Klipix</text>
        </g>
      </g>

      <!-- Static -->
      <g transform="translate(1800 0)">
        <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
        <g clip-path="url(#cardClip)">
          <rect x="25" y="20" width="850" height="210" fill="#FFFFFF" opacity="0.035"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="90 760" opacity="0.8">
            <animate attributeName="stroke-dashoffset" from="0" to="-850" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <rect x="55" y="45" width="7" height="7" fill="#FFFFFF">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <text x="75" y="52" font-size="14" opacity="0.65">03 // FEATURED REPOSITORY</text>
          <text x="55" y="118" font-size="34">Static</text>
          <text x="55" y="153" font-size="16" opacity="0.8">A simple Discord alternative project</text>
          <text x="55" y="183" font-size="14" opacity="0.55">JavaScript  //  web  //  experiments</text>
          <text x="55" y="213" font-size="13">github.com/yummyfiles/Static</text>
        </g>
      </g>

      <!-- StylerX -->
      <g transform="translate(2700 0)">
        <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
        <g clip-path="url(#cardClip)">
          <rect x="25" y="20" width="850" height="210" fill="#FFFFFF" opacity="0.035"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="90 760" opacity="0.8">
            <animate attributeName="stroke-dashoffset" from="0" to="-850" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <rect x="55" y="45" width="7" height="7" fill="#FFFFFF">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <text x="75" y="52" font-size="14" opacity="0.65">04 // FEATURED REPOSITORY</text>
          <text x="55" y="118" font-size="34">StylerX</text>
          <text x="55" y="153" font-size="16" opacity="0.8">Styler plugin for OBS Studio</text>
          <text x="55" y="183" font-size="14" opacity="0.55">OBS  //  Qt6  //  C++</text>
          <text x="55" y="213" font-size="13">github.com/yummyfiles/StylerX-Styler_for_OBS_Studio</text>
        </g>
      </g>

      <!-- HyprSetups -->
      <g transform="translate(3600 0)">
        <rect x="25" y="20" width="850" height="210" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
        <g clip-path="url(#cardClip)">
          <rect x="25" y="20" width="850" height="210" fill="#FFFFFF" opacity="0.035"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
          <path d="M25 78 H875" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="90 760" opacity="0.8">
            <animate attributeName="stroke-dashoffset" from="0" to="-850" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <rect x="55" y="45" width="7" height="7" fill="#FFFFFF">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <text x="75" y="52" font-size="14" opacity="0.65">05 // FEATURED REPOSITORY</text>
          <text x="55" y="118" font-size="34">HyprSetups</text>
          <text x="55" y="153" font-size="16" opacity="0.8">A collection of Hyprland rices and setups</text>
          <text x="55" y="183" font-size="14" opacity="0.55">Hyprland  //  dotfiles  //  ricing</text>
          <text x="55" y="213" font-size="13">github.com/yummyfiles/hyprsetups</text>
        </g>
      </g>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-900 0;-1800 0;-2700 0;-3600 0;0 0"
        keyTimes="0;.20;.40;.60;.80;1"
        dur="14s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"
      />
    </g>
  </g>
</svg>
