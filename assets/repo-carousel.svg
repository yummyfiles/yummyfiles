      <text x="55" y="170" font-size="14" opacity="0.55">JavaScript  //  web  //  experiments</text>
      <text x="55" y="205" font-size="13">github.com/yummyfiles/Static</text>
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.45;0.50;0.70;0.75;0.95;1" dur="16s" repeatCount="indefinite"/>
