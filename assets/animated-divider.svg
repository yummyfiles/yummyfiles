<svg xmlns="http://www.w3.org/2000/svg" width="900" height="34" viewBox="0 0 900 34">
  <rect width="900" height="34" fill="transparent"/>
  <path d="M0 17 H900" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <path d="M0 17 H900" stroke="currentColor" stroke-width="2" stroke-dasharray="18 72" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="0" cy="17" r="3" fill="currentColor">
    <animate attributeName="cx" from="0" to="900" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="17" r="3" fill="currentColor">
    <animate attributeName="cx" from="900" to="0" dur="3.2s" repeatCount="indefinite" begin="1.6s"/>
  </circle>
</svg>
