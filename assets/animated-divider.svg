<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44">
  <rect width="1000" height="44" fill="transparent"/>
  <path d="M100 22 H900" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
  <path d="M100 22 H900" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="32 88" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="100" cy="22" r="7" fill="#FFFFFF">
    <animate attributeName="cx" values="100;900;100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="22" r="4" fill="#FFFFFF">
    <animate attributeName="cx" values="900;100;900" dur="2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
  <path d="M100 8 H170 M830 8 H900" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.7s" repeatCount="indefinite"/>
  </path>
</svg>
