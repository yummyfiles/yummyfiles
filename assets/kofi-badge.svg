<svg xmlns="http://www.w3.org/2000/svg" width="250" height="40" viewBox="0 0 250 40" role="img" aria-label="Support me on Ko-fi">
  <defs>
    <clipPath id="badge"><rect width="250" height="40" rx="6"/></clipPath>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 32px 20px; }
      .scan { animation: scan 2.8s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .65; transform: scale(1.08); } }
      @keyframes scan { 0% { transform: translateX(-12px); opacity: 0; } 15% { opacity: .35; } 50% { opacity: .12; } 85% { opacity: .35; } 100% { transform: translateX(262px); opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="250" height="40" fill="#fff"/>
    <rect width="105" height="40" fill="#000"/>
    <rect class="scan" x="0" y="0" width="3" height="40" fill="#000"/>
    <g class="pulse" fill="#fff" transform="translate(32 20)">
      <path d="M-9-6h14c5 0 8 3 8 7s-3 7-8 7H0v5h-5V3h-4zm5 4v6h5c2 0 3-1 3-3s-1-3-3-3z" transform="translate(-7 -7)"/>
      <path d="M7-5c3 0 5 2 5 5 0 3-2 5-5 5" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <text x="53" y="25" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">SUPPORT ME ON</text>
    <text x="125" y="25" fill="#000" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ko-fi</text>
  </g>
  <rect x="0.5" y="0.5" width="249" height="39" rx="6" fill="none" stroke="#000" stroke-width="1"/>
</svg>
