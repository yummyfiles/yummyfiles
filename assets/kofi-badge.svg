<svg xmlns="http://www.w3.org/2000/svg" width="250" height="40" viewBox="0 0 250 40" role="img" aria-label="Support me on Ko-fi">
  <defs>
    <clipPath id="badge"><rect width="250" height="40" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="250" height="40" fill="#fff"/>
    <rect width="105" height="40" fill="#000"/>

    <rect x="0" y="0" width="3" height="40" fill="#fff" opacity="0">
      <animate attributeName="x" from="-8" to="258" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0.12;0.35;0" keyTimes="0;0.15;0.5;0.85;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Ko-fi-style coffee mug with heart -->
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(20 9)">
        <animateTransform attributeName="transform" type="translate" values="20 9;20 8;20 9" dur="2.4s" repeatCount="indefinite"/>
        <path d="M1 2h16v10a6 6 0 0 1-6 6H7a6 6 0 0 1-6-6V2Z" fill="#fff" stroke="none"/>
        <path d="M17 5h3a4 4 0 0 1 0 8h-3"/>
        <path d="M7 8c-1.8-2 1.2-3.8 2.2-1.5C10.2 4.2 13.2 6 11.4 8L9.2 10Z" fill="#000" stroke="none"/>
        <path d="M4 20h10"/>
      </g>
    </g>

    <text x="53" y="25" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">SUPPORT ME ON</text>
    <text x="125" y="25" fill="#000" font-family="Arial, sans-serif" font-size="16" font-weight="700">Ko-fi</text>
  </g>
  <rect x="0.5" y="0.5" width="249" height="39" rx="6" fill="none" stroke="#000" stroke-width="1"/>
</svg>
